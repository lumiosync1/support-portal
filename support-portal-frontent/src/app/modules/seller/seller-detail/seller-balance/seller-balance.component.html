<div class="card">
    <div class="card-header">
        <h3 class="card-title">Available Balance: {{balance | currency:'USD'}}</h3>
        <div class="card-toolbar">
            @if(allowTopup) {
                <div ngbDropdown class="d-inline-block">
                    <button type="button" class="btn btn-primary" id="dropdownBasic1" ngbDropdownToggle>
                        Action
                    </button>
                    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                        <button ngbDropdownItem (click)="openTopupModal()">
                            <i class="bi bi-coin text-primary fs-3 me-2"></i> Topup
                        </button>
                        <button ngbDropdownItem (click)="openWithdrawModal()">
                            <i class="bi bi-box-arrow-right text-primary fs-3 me-2"></i> Withdraw
                        </button>
                        <button ngbDropdownItem (click)="openAdjustModal()">
                            <i class="bi bi-pencil-square text-primary fs-3 me-2"></i> Adjust
                        </button>
                    </div>
                </div>
            }
        </div>
    </div>
    <div class="card-body">
        @if(seller) {
            <ejs-grid #grid [dataSource]='data' id="_balance-transaction-list"
                allowPaging='true' [pageSettings]='{ pageSize: 20, pageSizes: [10, 20, 30] }' 
                [allowSorting]='true' [sortSettings]="{ columns: [{ field: 'created_at', direction: 'Descending' }] }"
                [allowFiltering]='true' [filterSettings]="filterOptions"
                allowTextWrap='true'
                [enablePersistence]='false'
            >
                <e-columns>
                    <e-column field='tx_id' headerText='ID' textAlign='Right' width='70' ></e-column>
                    <e-column field='seller_id' headerText='Seller' textAlign='Right' width='70' [visible]="false"></e-column>
                    <e-column field='created_at' headerText='Date Time' width='120' format="MM/dd/yyyy HH:mm" ></e-column>
                    <e-column field='amount' headerText='Amount' textAlign='Right' width='90' ></e-column>
                    <e-column field='description' headerText='Description' width='130' [filter]="filterParams"></e-column>
                    <e-column field='category' headerText='Category' width='100' [filter]="{ params: { autofill: false } }"></e-column>
                    <e-column field='order_id' headerText='Order' textAlign='Right' width='80' ></e-column>
                    <e-column field='ref_id' headerText='Ref. No.' width='100' [filter]="{ params: { autofill: false } }"></e-column>
                    <e-column field='note' headerText='Note' width='130' [filter]="{ params: { autofill: false } }"></e-column>
                </e-columns>
            </ejs-grid>
        }
    </div>
</div>
