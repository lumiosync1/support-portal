<div class="card mb-6 mb-xl-9">
    <div class="card-body pt-9 pb-0">
        @if(seller) {
            <!--begin::Details-->
        <div class="d-flex flex-wrap flex-sm-nowrap mb-6">
            <!--begin::Image-->
            <!-- <div class="d-flex flex-center flex-shrink-0 bg-light rounded w-100px h-100px w-lg-150px h-lg-150px me-7 mb-4">
                <img class="mw-50px mw-lg-75px" src="/metronic8/demo1/assets/media/svg/brand-logos/volicity-9.svg" alt="image">
            </div> -->
            <!--end::Image-->

            <!--begin::Wrapper-->
            <div class="flex-grow-1">
                <!--begin::Head-->
                <div class="d-flex justify-content-between align-items-start flex-wrap mb-2">
                    <!--begin::Details-->
                    <div class="d-flex flex-column">
                        <!--begin::Status-->
                        <div class="d-flex align-items-center mb-1">
                            <span class="text-primary fs-2 fw-bold me-3">{{seller.seller_name}}</span>
                            @if(seller.active) {
                                <span class="badge badge-success me-auto">active</span>
                            } @else {
                                <span class="badge badge-secondary me-auto">inactive</span>
                            }
                        </div>
                        <!--end::Status-->

                        <!--begin::Description-->
                        <div class="d-flex flex-wrap fw-semibold mb-4 fs-5 text-gray-500">
                            #{{seller.seller_id}}
                        </div>
                        <!--end::Description-->
                    </div>
                    <!--end::Details-->

                    <!--begin::Actions-->
                    <div class="d-flex mb-4">
                        <!-- <a href="#" class="btn btn-sm btn-bg-light btn-active-color-primary me-3" data-bs-toggle="modal" data-bs-target="#kt_modal_users_search">Add User</a> -->

                        <!-- <a href="#" class="btn btn-sm btn-primary me-3" data-bs-toggle="modal" data-bs-target="#kt_modal_new_target">Add Target</a> -->

                        <!--begin::Menu-->
                        <div class="me-0">
                            <button class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">
                                <i class="bi bi-three-dots"></i>
                            </button>
                            
                            <!--begin::Menu 3-->
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg-light-primary fw-semibold w-200px py-3" data-kt-menu="true">
                                <!--begin::Heading-->
                                <!-- <div class="menu-item px-3">
                                    <div class="menu-content text-muted pb-2 px-3 fs-7 text-uppercase">
                                        Payments
                                    </div>
                                </div> -->
                                <!--end::Heading-->

                                @if(seller.active) {
                                <!--begin::Menu item-->
                                <div class="menu-item px-3">
                                    <a class="menu-link px-3 text-danger" (click)="confirmDisable()">
                                        <i class="bi bi-trash menu-icon text-danger"></i>
                                        Disable
                                    </a>
                                </div>
                                <!--end::Menu item-->
                                } @else {
                                <!--begin::Menu item-->
                                <div class="menu-item px-3">
                                    <a class="menu-link px-3 text-success" (click)="confirmEnable()">
                                        <i class="bi bi-check menu-icon text-success"></i>
                                        Enable
                                    </a>
                                </div>
                                <!--end::Menu item-->
                                }
                            </div>
                            <!--end::Menu 3-->
                        </div>
                        <!--end::Menu-->
                    </div>
                    <!--end::Actions-->
                </div>
                <!--end::Head-->

                <!--begin::Info-->
                <div class="d-flex flex-wrap justify-content-start">
                    <!--begin::Stats-->
                    <div class="d-flex flex-wrap">
                        <!--begin::Stat-->
                        <div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                            <!--begin::Number-->
                            <div class="d-flex align-items-center">
                                <div class="fs-4 fw-bold">{{seller.created_at | date: 'dd MMM, y'}}</div>
                            </div>
                            <!--end::Number-->

                            <!--begin::Label-->
                            <div class="fw-semibold fs-6 text-gray-500">Join Date</div>
                            <!--end::Label-->
                        </div>
                        <!--end::Stat-->

                        <!--begin::Stat-->
                        <div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                            <!--begin::Number-->
                            <div class="d-flex align-items-center">
                                <i class="ki-duotone ki-arrow-down fs-3 text-danger me-2"><span class="path1"></span><span class="path2"></span></i>
                                <div class="fs-4 fw-bold counted">US</div>
                            </div>
                            <!--end::Number-->

                            <!--begin::Label-->
                            <div class="fw-semibold fs-6 text-gray-500">Market Region</div>
                            <!--end::Label-->
                        </div>
                        <!--end::Stat-->

                    </div>
                    <!--end::Stats-->
                </div>
                <!--end::Info-->
            </div>
            <!--end::Wrapper-->
        </div>
        <!--end::Details-->

        <div class="separator"></div>

        <!--begin::Nav-->
        <ul class="nav nav-stretch nav-line-tabs nav-line-tabs-2x border-transparent fs-5 fw-bold">
                            <!--begin::Nav item-->
                <li class="nav-item">
                    <a class="nav-link text-active-primary py-5 me-6 active" [routerLink]="['balance']" routerLinkActive="active">
                        <i class="bi bi-currency-dollar"></i> Balance
                    </a>
                </li>
                <!--end::Nav item-->

                <!--begin::Nav item-->
                <li class="nav-item">
                    <a class="nav-link text-active-primary py-5 me-6 " [routerLink]="['settings']" routerLinkActive="active">
                        <i class="bi bi-gear"></i> &nbsp; Settings
                    </a>
                </li>
                <!--end::Nav item-->
                    </ul>
        <!--end::Nav-->
        } @else {
            <div class="d-flex flex-wrap flex-sm-nowrap mb-6">
                <div class="d-flex flex-column">
                    <div class="d-flex align-items-center mb-1">
                        <span class="text-primary fs-2 fw-bold me-3">No Seller Found</span>
                    </div>
                </div>
            </div>
        }
    </div>
</div>

@if (seller) {
    <router-outlet></router-outlet>
}
